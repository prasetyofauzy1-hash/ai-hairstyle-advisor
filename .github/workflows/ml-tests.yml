name: ml-tests

on:
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-tests.yml"]
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ml-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hairstyle-advisor/models
          key: mediapipe-models-${{ hashFiles('ml/models/download.py') }}
      - run: pip install -r ml/requirements.txt
      - run: python -m ml.models.download
      - run: python -m pytest ml/tests -q
