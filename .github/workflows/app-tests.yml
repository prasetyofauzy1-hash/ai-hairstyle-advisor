name: app-tests

on:
  pull_request:
    paths: ["backend/**", "frontend/web/**", "ml/**", ".github/workflows/app-tests.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "frontend/web/**", "ml/**", ".github/workflows/app-tests.yml"]

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hairstyle
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hairstyle_advisor
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hairstyle" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hairstyle:ci-only@localhost:5432/hairstyle_advisor
      IMAGE_STORAGE_DIR: ${{ runner.temp }}/images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hairstyle-advisor/models
          key: mediapipe-models-${{ hashFiles('ml/models/download.py') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2 libgl1
      - run: pip install -r backend/requirements.txt
      - run: python -m ml.models.download
      - name: Backend integration tests (Postgres)
        run: python -m pytest backend/tests -q
      - name: Migrate and start API
        working-directory: backend
        env:
          PYTHONPATH: ..:.
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ${{ runner.temp }}/api.log 2>&1 &
      - name: Web lint, typecheck, build
        working-directory: frontend/web
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build
      - name: Browser end-to-end
        working-directory: frontend/web
        run: |
          npx playwright install --with-deps chromium
          nohup npm run start > ${{ runner.temp }}/web.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000 http://localhost:8000/api/health
          npm run test:e2e
      - if: failure()
        run: tail -100 ${{ runner.temp }}/api.log || true
